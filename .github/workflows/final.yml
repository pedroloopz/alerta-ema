name: final

# Roda so quando voce mandar. Backtest final do Donchian x alternativos.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt yfinance lxml

      - name: Baixar precos (Yahoo e Binance)
        env:
          SAIDA: dados
        run: python coleta/coleta_precos.py

      - name: Backtest final
        env:
          DADOS: dados
        run: python backtest_final.py

      - name: Salvar relatorio no repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add relatorio_final.txt final_resumo.csv || true
          git diff --staged --quiet || git commit -m "backtest final"
          git pull --rebase --autostash || true
          git push || true

      - name: Avisar falha no Telegram
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="⚠️ O backtest final FALHOU. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
