name: copiar-telegram

# Rode a mão, uma vez: copia o bot do Telegram (token, grupo e tópico 📈 Trade) para o robo-bingx.
# Os valores vão direto de um repositório para o outro, criptografados; nada aparece no log.
# Precisa que o ROBO_TOKEN tenha "Secrets" e "Variables" (leitura e escrita) no robo-bingx.
on:
  workflow_dispatch:

jobs:
  copiar:
    runs-on: ubuntu-24.04
    steps:
      - name: Copiar para o robo-bingx
        env:
          GH_TOKEN: ${{ secrets.ROBO_TOKEN }}
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_TOPICO: ${{ vars.TELEGRAM_THREAD_ID }}
        run: |
          R=pedroloopz/robo-bingx
          printf '%s' "$TG_TOKEN" | gh secret set TELEGRAM_TOKEN -R "$R"
          printf '%s' "$TG_CHAT" | gh secret set TELEGRAM_CHAT_ID -R "$R"
          gh variable set TELEGRAM_THREAD_ID -R "$R" --body "$TG_TOPICO"
          echo "Copiado: TELEGRAM_TOKEN, TELEGRAM_CHAT_ID e TELEGRAM_THREAD_ID no robo-bingx."
