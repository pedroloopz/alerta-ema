name: previa

on:
  schedule:
    # 12h UTC = 9h em Brasilia, antes de abrir a B3 (10h) e Nova York
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write   # estado dos avisos (.avisos/)

jobs:
  previa:
    runs-on: ubuntu-24.04
    env:
      TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
      TELEGRAM_AVISOS_THREAD_ID: ${{ vars.TELEGRAM_AVISOS_THREAD_ID }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pandas requests matplotlib yfinance lxml

      - name: Montar a previa do dia
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: python previa.py 2>&1 | tee -a run.log

      - name: Avisar falha (topico Avisos)
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 avisos.py "${{ github.workflow }}" "${{ job.status }}"
