name: painel-longo

# Teste longo do modelo (cripto + ações num modelo só), mês a mês, com a saída real do robô.
# Só relatório: relatorio_longo.txt. Não muda o painel nem o robô.
on:
  workflow_dispatch:
    inputs:
      meses:
        description: "Meses de histórico"
        default: "30"
  push:
    branches: [main]
    paths: [painel/teste_longo.py, .github/workflows/painel-longo.yml]

permissions:
  contents: write

concurrency:
  group: painel-longo
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
      TELEGRAM_AVISOS_THREAD_ID: ${{ vars.TELEGRAM_AVISOS_THREAD_ID }}
      DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - run: pip install pandas==3.1.0 numpy==2.5.4 requests==2.34.2 scikit-learn==1.9.1
      - name: Checagem (entrada na abertura seguinte, ações só no pregão, custo 0,3%)
        timeout-minutes: 120
        shell: bash
        env:
          CHECAGEM: "1"
          CUSTO: "0.003"
        run: python painel/teste_longo.py --meses "${{ github.event.inputs.meses || '30' }}" 2>&1 | tail -5
      - name: Teste mês a mês
        timeout-minutes: 320
        shell: bash
        run: python painel/teste_longo.py --meses "${{ github.event.inputs.meses || '30' }}" 2>&1 | tee run.log; exit ${PIPESTATUS[0]}
      - name: Salvar relatório
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp run.log painel/teste_longo.log 2>/dev/null || true
          for f in relatorio_longo.txt relatorio_longo_checagem.txt painel/teste_longo.log; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || git commit -m "painel: teste longo do modelo"
          git pull --rebase --autostash || true
          git push || true
      - name: Avisar falha (topico Avisos)
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
        run: python3 avisos.py "${{ github.workflow }}" "${{ job.status }}"
