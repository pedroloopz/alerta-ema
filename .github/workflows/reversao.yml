name: reversao-longo

# Roda so quando voce mandar. Teste longo da reversao semanal.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-24.04
    env:
      TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
      TELEGRAM_AVISOS_THREAD_ID: ${{ vars.TELEGRAM_AVISOS_THREAD_ID }}
      DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Testar reversao em historico longo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_KLINES: https://fapi.asterdex.com/fapi/v1/klines
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
        shell: bash
        run: python backtest_reversao.py 2>&1 | tee -a run.log

      - name: Salvar relatorio no repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add relatorio_reversao.txt reversao_semanas.csv || true
          git diff --staged --quiet || git commit -m "teste longo da reversao"
          git pull --rebase --autostash || true
          git push || true

      - name: Avisar falha (topico Avisos)
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
        run: python3 avisos.py "${{ github.workflow }}" "${{ job.status }}"
