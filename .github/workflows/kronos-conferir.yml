name: kronos-conferir

# De hora em hora: põe as velas reais ao lado dos 100 futuros previstos (kronos/grafico.html na branch kronos)
# e, quando fecham as 24 velas, manda o placar no Discord (uma vez por previsão). Sem modelo, roda rápido.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: kronos-conferir
  cancel-in-progress: false

jobs:
  conferir:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Há previsão nas últimas 30h?
        id: ha
        run: |
          git fetch -q --depth 1 origin +kronos:refs/remotes/origin/kronos || { echo "ok=nao" >> "$GITHUB_OUTPUT"; exit 0; }
          git show origin/kronos:kronos/previsao.json > kronos/previsao.json
          git show origin/kronos:kronos/sinais.json > kronos/sinais.json
          git show origin/kronos:kronos/conferido.json > kronos/conferido.json 2>/dev/null || rm -f kronos/conferido.json
          git show origin/kronos:kronos/historico.json > kronos/historico.json 2>/dev/null || rm -f kronos/historico.json
          python3 -c "import json,datetime as d,sys;p=json.load(open('kronos/previsao.json'));t=d.datetime.fromisoformat(p['gerado_em']);sys.exit(0 if d.datetime.now(d.timezone.utc)-t<d.timedelta(hours=30) else 1)" \
            && echo "ok=sim" >> "$GITHUB_OUTPUT" || echo "ok=nao" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        if: steps.ha.outputs.ok == 'sim'
        with: { python-version: "3.11" }
      - if: steps.ha.outputs.ok == 'sim'
        run: pip install -q numpy==2.4.6 pandas==3.1.0 matplotlib==3.11.2
      - name: Conferir
        if: steps.ha.outputs.ok == 'sim'
        env:
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
        run: python kronos/prever.py conferir
      - name: Guardar na branch kronos
        if: steps.ha.outputs.ok == 'sim'
        run: |
          mkdir -p /tmp/k && cp kronos/sinais.json kronos/previsao.json kronos/grafico.html kronos/grafico.png /tmp/k/
          [ -f kronos/conferido.json ] && cp kronos/conferido.json /tmp/k/
          cp kronos/historico.json /tmp/k/ 2>/dev/null || true
          git config user.name "kronos"; git config user.email "kronos@users.noreply.github.com"
          rm -f kronos/sinais.json kronos/previsao.json kronos/grafico.html kronos/grafico.png kronos/conferido.json kronos/historico.json
          git checkout -q -B kronos-conf origin/kronos && mkdir -p kronos && cp /tmp/k/* kronos/
          git add kronos && (git diff --staged --quiet || git commit -qm "conferir $(date -u +%F_%H)") && git push -q origin HEAD:kronos
