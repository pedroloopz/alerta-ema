name: coleta

# Temporario (branch donchian): baixa listas e dados que o ambiente de
# desenvolvimento nao alcanca e guarda tudo na branch dados-backtest.
on:
  push:
    branches: [donchian]
    paths: ["coleta/**", ".github/workflows/coleta.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pandas yfinance lxml

      - name: Coletar
        env:
          SAIDA: ${{ runner.temp }}/saida
        run: |
          for s in coleta/coleta_*.py; do
            echo "== $s"; python "$s" || echo "falhou: $s"
          done

      - name: Guardar na branch dados-backtest
        env:
          SAIDA: ${{ runner.temp }}/saida
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin dados-backtest >/dev/null; then
            git fetch origin dados-backtest && git checkout dados-backtest
          else
            git checkout --orphan dados-backtest && git rm -rf . -q
          fi
          mkdir -p coleta && cp -r "$SAIDA"/. coleta/
          git add coleta
          git commit -q -m "coleta ${{ github.sha }}" || true
          git push origin dados-backtest
