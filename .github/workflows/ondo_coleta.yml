name: ondo-coleta

# Roda a cada push que mexer no script de coleta da ONDO (ou quando voce mandar).
on:
  push:
    paths: ["coleta/ondo_4h.py", ".github/workflows/ondo_coleta.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas requests

      - run: python coleta/ondo_4h.py

      - name: Salvar candles no repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add coleta/ondo || true
          git diff --staged --quiet || git commit -m "coleta: candles 4h/1d ONDO e BTC"
          git pull --rebase --autostash || true
          git push || true
