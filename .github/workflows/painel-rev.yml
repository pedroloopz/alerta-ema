name: painel-rev

# Roda so quando voce mandar. Backtest do setup REV (reversao com volume, padrao das carteiras
# vencedoras) x setups atuais do painel nos perps da BingX. Salva relatorio_rev.txt.
on:
  workflow_dispatch:
    inputs:
      max:
        description: "Limitar a N ativos (0 = todos)"
        default: "0"

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
      TELEGRAM_AVISOS_THREAD_ID: ${{ vars.TELEGRAM_AVISOS_THREAD_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Backtest
        shell: bash
        run: python painel/backtest_rev.py --max "${{ inputs.max }}" 2>&1 | tee run.log; exit ${PIPESTATUS[0]}
      - name: Salvar relatorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add relatorio_rev.txt
          git diff --staged --quiet || git commit -m "relatorio do backtest REV"
          git pull --rebase --autostash && git push
      - name: Avisar falha (topico Avisos)
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 avisos.py "${{ github.workflow }}" "${{ job.status }}"
