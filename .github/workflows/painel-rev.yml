name: painel-rev

# Roda so quando voce mandar. Backtest do setup REV (reversao com volume, padrao das carteiras
# vencedoras) x setups atuais do painel nos perps da BingX. Salva relatorio_rev.txt.
on:
  workflow_dispatch:
    inputs:
      max:
        description: "Limitar a N ativos (0 = todos)"
        default: "0"
      script:
        description: "Backtest a rodar (backtest_rev.py ou backtest_exa.py)"
        default: "backtest_rev.py"

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
      TELEGRAM_AVISOS_THREAD_ID: ${{ vars.TELEGRAM_AVISOS_THREAD_ID }}
      DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - run: pip install pandas==3.1.0 numpy==2.5.4
      - name: Backtest
        shell: bash
        run: python painel/${{ inputs.script }} $([ "${{ inputs.script }}" = backtest_rev.py ] && echo --max "${{ inputs.max }}") 2>&1 | tee run.log; exit ${PIPESTATUS[0]}
      - name: Salvar relatorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add relatorio_*.txt
          git diff --staged --quiet || git commit -m "relatorio de backtest do painel"
          git pull --rebase --autostash && git push
      - name: Avisar falha (topico Avisos)
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
        run: python3 avisos.py "${{ github.workflow }}" "${{ job.status }}"
