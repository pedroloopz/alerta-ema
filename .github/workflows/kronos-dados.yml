name: kronos-dados

# Base para os agentes de teste: 1 ano de previsões do Kronos-small (1 partida a cada 46h, 8 caminhos)
# + velas reais seguintes e o funding real, por ativo. Desde 21/10/2026: 1 partida a cada 23h em todos os ativos
# (antes 92h) na branch kronos-dados-23h; a kronos-dados antiga fica como estava. Não mexe no robô nem na branch kronos.
# Roda de hora em hora (uma rodada por vez, emendando) e retoma de onde parou; quando todos os ativos
# estão feitos, não faz nada. Ordem: primeiro os ativos que o robô opera (acerto 59%+ no teste semanal).
on:
  workflow_dispatch:
  # 30/10/2026: horário desligado — o robô passou para velas de 4h; a base nova é a do kronos-bt4h.

permissions:
  contents: write

concurrency:
  group: kronos-dados
  cancel-in-progress: false

env:
  PASSO: 23                  # horas entre partidas (todas as horas do dia em ~1 dia de diferença)
  KRONOS_COMMIT: 67b630e67f6a18c9e9be918d9b4337c960db1e9a
  PARTES: 4                  # 4 máquinas: o kronos de hora em hora voltou em 21/10 (setup recuo)

jobs:
  lista:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      partes: ${{ steps.p.outputs.partes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.11" }
      - run: pip install -q numpy==2.4.6 pandas==3.1.0
      - name: Ativos que faltam
        run: |
          git fetch -q --depth 1 origin +kronos-dados-23h:refs/remotes/origin/kronos-dados-23h 2>/dev/null && \
            git ls-tree --name-only origin/kronos-dados-23h dados/ | sed 's#dados/##; s#\.json\.gz$##' > feitos.txt || touch feitos.txt
          mkdir -p saida
          git fetch -q --depth 1 origin +kronos:refs/remotes/origin/kronos 2>/dev/null && \
            git show origin/kronos:kronos/teste_semanal.json > saida/teste_semanal.json || true
          python kronos/dados_teste.py lista feitos.txt
      - id: p
        run: |
          n=$(python -c 'import json;print(len(json.load(open("saida/universo.json"))))')
          if [ "$n" = "0" ]; then echo 'partes=[]' >> "$GITHUB_OUTPUT"
          else echo "partes=$(python -c 'import json;print(json.dumps(list(range(int(${{ env.PARTES }})))))')" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with: { name: universo-dados, path: saida/universo.json }

  prever:
    needs: lista
    if: needs.lista.outputs.partes != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        parte: ${{ fromJson(needs.lista.outputs.partes) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.11" }
      - name: Instalar Kronos (CPU)
        run: |
          pip install -q torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy==2.4.6 pandas==3.1.0 einops==0.8.1 huggingface_hub==0.33.1 safetensors==0.8.0 tqdm==4.70.1
          git clone -q https://github.com/shiyu-coder/Kronos.git Kronos && git -C Kronos checkout -q "$KRONOS_COMMIT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with: { path: ~/.cache/huggingface, key: kronos-small-v1 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with: { name: universo-dados, path: saida }
      - run: python kronos/dados_teste.py rodar ${{ matrix.parte }} $PARTES
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with: { name: "dados-${{ matrix.parte }}", path: "saida/dados/*.json.gz", if-no-files-found: ignore }

  gravar:
    needs: prever
    if: always() && needs.prever.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with: { pattern: "dados-*", path: novos, merge-multiple: true }
      - name: Publicar na branch kronos-dados-23h
        run: |
          ls novos/*.json.gz >/dev/null 2>&1 || { echo "nada novo"; exit 0; }
          git config user.name "kronos"; git config user.email "kronos@users.noreply.github.com"
          if git fetch -q origin +kronos-dados-23h:refs/remotes/origin/kronos-dados-23h 2>/dev/null; then
            git checkout -q -B kronos-dados-23h origin/kronos-dados-23h
          else
            git checkout -q --orphan kronos-dados-23h && git rm -rq --cached . && git clean -fdq -e novos
          fi
          mkdir -p dados && cp novos/*.json.gz dados/ && rm -rf novos
          git add dados && git commit -qm "dados $(date -u +%F_%H) ($(ls dados | wc -l) ativos)" && git push -q origin HEAD:kronos-dados-23h
