name: backtest-robo

# Backtest de 2 anos das regras atuais do robô da BingX + janelas de 2 meses.
# Só leitura: não opera nada. Roda à mão ou quando o script muda. Resultado: relatorio_robo.txt
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [backtest_robo.py, regras_robo.py, .github/workflows/backtest-robo.yml]

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas==3.1.0 numpy==2.5.4 requests==2.34.2 yfinance==1.7.0 lxml==6.1.3
      - name: Backtest
        run: python backtest_robo.py 2>&1 | tee run.log
      - name: Salvar relatório
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for f in relatorio_robo.txt robo_trades.csv; do [ -f "$f" ] && git add "$f"; done; true
          git diff --staged --quiet || git commit -m "backtest do robô"
          git pull --rebase --autostash || true
          git push || true
