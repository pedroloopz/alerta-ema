name: bot

on:
  schedule:
    # De hora em hora, dias uteis, 13h15 a 22h15 UTC (10h15 a 19h15 em Brasilia).
    # Cobre o pregao de NY com e sem horario de verao (NY sai dele em 01/11/2026):
    # o proprio bot decide, pelo relogio de NY, se e hora de entrada ou de saida.
    - cron: "15 13-22 * * 1-5"
    # Reforco aos :45 (o GitHub atrasa ou pula execucoes agendadas). So a parte
    # EUA roda nesta: B3 e futuros continuam de hora em hora.
    - cron: "45 13-22 * * 1-5"
    # Todo dia 00h05 UTC (21h05 em Brasilia): candle diario da ASTER fechado.
    # Esta execucao so cuida da ASTER (B3 e futuros ficam de fora).
    - cron: "5 0 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "O que rodar agora"
        type: choice
        default: auto
        options: [auto, tudo, pregao, fechamento, cripto, diagnostico, demo]

permissions:
  contents: write

concurrency:
  group: bot-carteira
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas requests matplotlib yfinance lxml

      - name: Rodar o bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO: ${{ inputs.modo || 'auto' }}
          CRON: ${{ github.event.schedule }}
        run: python bot.py

      - name: Salvar carteira e estado
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for f in carteira.json estado_bot.json placar_notas.csv carteira_b3.json estado_b3.json placar_notas_b3.csv perps.json estado_perps.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "bot: atualiza carteira"
          git pull --rebase --autostash || true
          git push || true

      - name: Avisar falha no Telegram
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="⚠️ O bot da carteira FALHOU. Enquanto isso, nenhum alerta chega. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
