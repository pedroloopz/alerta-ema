name: bot

on:
  schedule:
    # De hora em hora, dias uteis, 13h15 a 22h15 UTC (10h15 a 19h15 em Brasilia).
    # Cobre o pregao de NY com e sem horario de verao (NY sai dele em 01/11/2026):
    # o proprio bot decide, pelo relogio de NY, se e hora de entrada ou de saida.
    - cron: "15 13-22 * * 1-5"
    # Reforco aos :45 (o GitHub atrasa ou pula execucoes agendadas). So a parte
    # EUA roda nesta: B3 e futuros continuam de hora em hora.
    - cron: "45 13-22 * * 1-5"
    # Todo dia 00h05 UTC (21h05 em Brasilia): candle diario da ASTER fechado.
    # Esta execucao so cuida da ASTER (B3 e futuros ficam de fora).
    - cron: "5 0 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "O que rodar agora"
        type: choice
        default: auto
        options: [auto, tudo, pregao, fechamento, cripto, diagnostico, demo]

permissions:
  contents: write

concurrency:
  group: bot-carteira
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-24.04
    env:
      TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
      TELEGRAM_AVISOS_THREAD_ID: ${{ vars.TELEGRAM_AVISOS_THREAD_ID }}
      DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      - run: pip install pandas==3.1.0 requests==2.34.2 matplotlib==3.11.2 yfinance==1.7.0 lxml==6.1.3 ccxt==4.5.90

      - name: Abrir o cofre (carteira e estados ficam criptografados no repositório público)
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: python3 cofre.py abrir

      - name: Rodar o bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO: ${{ inputs.modo || 'auto' }}
          CRON: ${{ github.event.schedule }}
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
        shell: bash
        run: python bot.py 2>&1 | tee -a run.log

      - name: Salvar carteira e estado
        if: always()
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          python3 cofre.py fechar
          git add -- *.enc backups/*.enc
          for f in placar_notas.csv placar_notas_b3.csv; do
            [ -f "$f" ] && git add "$f"
          done
          git rm -q --cached --ignore-unmatch $(python3 -c "import cofre; print(' '.join(cofre.SENSIVEIS))")
          git diff --staged --quiet || git commit -m "bot: atualiza carteira"
          git pull --rebase --autostash || true
          git push || true

      - name: Avisar falha (topico Avisos)
        if: always()
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
        run: python3 avisos.py "${{ github.workflow }}" "${{ job.status }}"
