name: kronos

# Kronos-small: 100 futuros das próximas 24 velas de 1h para 30 criptos + ações dos EUA (BingX),
# teste semanal de 1 ano e trades para o robô (kronos/sinais.json na branch kronos).
# Repositório público: minutos grátis e 20 máquinas em paralelo. Nenhuma chave da BingX aqui.
on:
  workflow_dispatch:
    inputs:
      so_extras:
        description: "Só índices e commodities (junta com a rodada anterior de até 6h)"
        type: boolean
        default: false
      rapida:
        description: "Rodada rápida (só os 100 futuros; usa o teste da semana) — o painel-scanner dispara de hora em hora"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [kronos/prever.py, kronos/modelo_grafico.html, .github/workflows/kronos.yml]
  schedule:
    - cron: "7 23 * * 1"     # toda segunda, 20h07 de Brasília: completa (100 futuros + teste de 1 ano)
    # a rodada rápida de hora em hora é disparada pelo painel-scanner (kronos/acordar.py)

permissions:
  contents: write

concurrency:
  group: kronos
  cancel-in-progress: false

env:
  RAPIDA: ${{ (github.event.schedule == '37 * * * *' || inputs.rapida) && '1' || '0' }}
  KRONOS_COMMIT: 67b630e67f6a18c9e9be918d9b4337c960db1e9a
  PARTES: 64                 # 28/10: ~160 ativos; o GitHub roda 20 por vez; partes menores não estouram o tempo

jobs:
  lista:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      partes: ${{ steps.p.outputs.partes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.11" }
      - run: pip install -q numpy==2.4.6 pandas==3.1.0
      - run: python kronos/prever.py lista
        env:
          KRONOS_SO_EXTRAS: ${{ inputs.so_extras && '1' || '0' }}
      - id: p
        run: echo "partes=$(python -c 'import json;print(json.dumps(list(range(int(${{ env.PARTES }})))))')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with: { name: universo, path: saida/universo.json }

  prever:
    needs: lista
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 16        # a conta tem 20 máquinas ao mesmo tempo: sobram vagas para o robô, o scanner e o bot
      matrix:
        parte: ${{ fromJson(needs.lista.outputs.partes) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.11" }
      - name: Instalar Kronos (CPU)
        run: |
          pip install -q torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy==2.4.6 pandas==3.1.0 einops==0.8.1 huggingface_hub==0.33.1 safetensors==0.8.0 tqdm==4.70.1
          git clone -q https://github.com/shiyu-coder/Kronos.git Kronos && git -C Kronos checkout -q "$KRONOS_COMMIT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with: { path: ~/.cache/huggingface, key: kronos-small-v1 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with: { name: universo, path: saida }
      - run: |
          if [ "$RAPIDA" = "1" ]; then
            export KRONOS_RAPIDA=1
            git fetch -q --depth 1 origin +kronos:refs/remotes/origin/kronos && \
              (git show origin/kronos:kronos/teste_semanal.json > kronos/teste_semanal.json 2>/dev/null || \
               git show origin/kronos:kronos/previsao.json > kronos/teste_semanal.json) || true
          fi
          python kronos/prever.py rodar ${{ matrix.parte }} $PARTES
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with: { name: "parte-${{ matrix.parte }}", path: "saida/parte_*.json", if-no-files-found: ignore }

  juntar:
    needs: prever
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.11" }
      - run: pip install -q numpy==2.4.6 pandas==3.1.0 matplotlib==3.11.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with: { pattern: "parte-*", path: saida, merge-multiple: true }
      - name: Rodada anterior e teste semanal
        run: |
          git fetch -q --depth 1 origin +kronos:refs/remotes/origin/kronos || exit 0
          git show origin/kronos:kronos/teste_semanal.json > kronos/teste_semanal.json 2>/dev/null || \
            git show origin/kronos:kronos/previsao.json > kronos/teste_semanal.json || rm -f kronos/teste_semanal.json
          git show origin/kronos:kronos/historico.json > kronos/historico.json 2>/dev/null || rm -f kronos/historico.json
          git show origin/kronos:kronos/conferido.json > kronos/conferido.json 2>/dev/null || rm -f kronos/conferido.json
          if [ "${{ inputs.so_extras }}" = "true" ]; then git show origin/kronos:kronos/previsao.json > kronos/previsao_anterior.json || true; fi
      - name: Juntar, escolher trades, desenhar, avisar no Discord
        env:
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
        run: python kronos/prever.py juntar
      - name: Painel Kronos 24h no Drive (o artifact lê de lá)
        continue-on-error: true
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          pip install -q google-auth==2.62.0 requests==2.34.2
          python kronos/subir_drive.py kronos/painel_dados.json 1dFoJgJIfw0VIlxdmxwxdLZT8rGBiWygl
      - name: Publicar na branch kronos
        run: |
          mkdir -p /tmp/k && cp kronos/sinais.json kronos/previsao.json kronos/grafico.html kronos/grafico.png kronos/teste_semanal.json kronos/historico.json /tmp/k/
          cp kronos/conferido.json /tmp/k/ 2>/dev/null || true
          git config user.name "kronos"; git config user.email "kronos@users.noreply.github.com"
          git checkout -q --orphan kronos-novo && git rm -rq --cached . && git clean -fdq -e saida
          mkdir -p kronos && cp /tmp/k/* kronos/
          git add kronos && git commit -qm "kronos $(date -u +%F_%H)" && git push -qf origin HEAD:kronos
      - name: Acordar o robô (entra nos trades na hora)
        env:
          ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
        run: |
          [ -z "$ROBO_TOKEN" ] && exit 0
          [ "$RAPIDA" = "1" ] && { echo "rodada rápida: o robô pega os sinais no ciclo de 30 min"; exit 0; }
          curl -s -o /dev/null -w "robô: %{http_code}\n" -X POST -H "Authorization: Bearer $ROBO_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/pedroloopz/robo-bingx/actions/workflows/operar.yml/dispatches \
            -d '{"ref":"main","inputs":{"motivo":"kronos"}}'
