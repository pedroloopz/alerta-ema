name: swing-sombras

# Backtest de 2 anos das sombras de swing (Donchian, repique com semanal forte, virada) e do original em 4h.
# Só leitura: não opera nada. Roda à mão ou quando o script muda. Resultado: relatorio_swing_sombras.txt
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [backtest_sombras.py, estrategias_swing.py, .github/workflows/swing-sombras.yml]

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests yfinance lxml
      - name: Backtest
        run: python backtest_sombras.py 2>&1 | tee run.log
      - name: Salvar relatório
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for f in relatorio_swing_sombras.txt; do [ -f "$f" ] && git add "$f"; done; true
          git diff --staged --quiet || git commit -m "backtest das sombras de swing"
          git pull --rebase --autostash || true
          git push || true
