name: kronos-bt4h

# 30/10/2026: backtest de 6 meses do setup ao vivo do robô em velas de 4h (kronos/bt4h.py).
# Base: previsões reais do Kronos-small em 4h (8 caminhos), 1 partida a cada 13 velas (52h, passa por todos os
# horários), ~84 partidas por ativo, com as 24 velas reais seguintes e o funding real — branch kronos-dados-4h.
# Roda de hora em hora, retoma de onde parou e, a cada rodada, refaz o relatório com o que já existe
# (kronos-dados-4h: bt4h.json). Quando todos os ativos estão feitos, só refaz o relatório. Só R, sem dinheiro.
on:
  workflow_dispatch:
  schedule:
    - cron: "11 * * * *"

permissions:
  contents: write

concurrency:
  group: kronos-bt4h
  cancel-in-progress: false

env:
  KRONOS_INTERVALO: "4h"
  PASSO: 13                  # velas de 4h entre partidas (52h)
  DIAS: 46                   # 46 × 24 / 13 = 84 partidas ≈ 6 meses
  N_TESTE: 8                 # caminhos por partida
  KRONOS_COMMIT: 67b630e67f6a18c9e9be918d9b4337c960db1e9a
  PARTES: 14

jobs:
  lista:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      partes: ${{ steps.p.outputs.partes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.11" }
      - run: pip install -q numpy==2.4.6 pandas==3.1.0
      - name: Ativos que faltam
        run: |
          git fetch -q --depth 1 origin +kronos-dados-4h:refs/remotes/origin/kronos-dados-4h 2>/dev/null && \
            git ls-tree --name-only origin/kronos-dados-4h dados/ | sed 's#dados/##; s#\.json\.gz$##' > feitos.txt || touch feitos.txt
          mkdir -p saida
          python kronos/dados_teste.py lista feitos.txt
      - id: p
        run: |
          n=$(python -c 'import json;print(len(json.load(open("saida/universo.json"))))')
          if [ "$n" = "0" ]; then echo 'partes=[]' >> "$GITHUB_OUTPUT"
          else echo "partes=$(python -c 'import json;print(json.dumps(list(range(int(${{ env.PARTES }})))))')" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with: { name: universo-bt4h, path: saida/universo.json }

  prever:
    needs: lista
    if: needs.lista.outputs.partes != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8           # deixa máquinas livres para o Kronos ao vivo e o robô
      matrix:
        parte: ${{ fromJson(needs.lista.outputs.partes) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.11" }
      - name: Instalar Kronos (CPU)
        run: |
          pip install -q torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy==2.4.6 pandas==3.1.0 einops==0.8.1 huggingface_hub==0.33.1 safetensors==0.8.0 tqdm==4.70.1
          git clone -q https://github.com/shiyu-coder/Kronos.git Kronos && git -C Kronos checkout -q "$KRONOS_COMMIT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with: { path: ~/.cache/huggingface, key: kronos-small-v1 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with: { name: universo-bt4h, path: saida }
      - run: python kronos/dados_teste.py rodar ${{ matrix.parte }} $PARTES
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with: { name: "bt4h-${{ matrix.parte }}", path: "saida/dados/*.json.gz", if-no-files-found: ignore }

  gravar:
    needs: [lista, prever]
    if: always() && needs.lista.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.11" }
      - run: pip install -q numpy==2.4.6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        continue-on-error: true
        with: { pattern: "bt4h-*", path: novos, merge-multiple: true }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with: { name: universo-bt4h, path: saida }
      - name: Juntar na branch kronos-dados-4h e refazer o relatório
        run: |
          cp kronos/bt4h.py /tmp/bt4h.py
          git config user.name "kronos"; git config user.email "kronos@users.noreply.github.com"
          if git fetch -q origin +kronos-dados-4h:refs/remotes/origin/kronos-dados-4h 2>/dev/null; then
            git checkout -q -B kronos-dados-4h origin/kronos-dados-4h
          else
            git checkout -q --orphan kronos-dados-4h && git rm -rq --cached . && git clean -fdq -e novos -e saida
          fi
          mkdir -p dados
          ls novos/*.json.gz >/dev/null 2>&1 && cp novos/*.json.gz dados/
          rm -rf novos
          ls dados/*.json.gz >/dev/null 2>&1 || { echo "ainda sem dados"; exit 0; }
          python /tmp/bt4h.py . bt4h.json
          python -c "import json;d=json.load(open('bt4h.json'));d['faltavam_no_inicio_da_rodada']=len(json.load(open('saida/universo.json')));json.dump(d,open('bt4h.json','w'),ensure_ascii=False,indent=1)"
          rm -rf saida
          git add dados bt4h.json && git commit -qm "bt4h $(date -u +%F_%H) ($(ls dados | wc -l) ativos)" && git push -q origin HEAD:kronos-dados-4h || true
