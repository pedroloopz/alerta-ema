name: painel-baixar
on:
  push:
    branches: [painel]
    paths: [painel/baixar.py, .github/workflows/painel-baixar.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - run: python painel/baixar.py
      - name: Gravar na branch painel-dados (1 commit so)
        run: |
          tar czf /tmp/pacote.tgz pacote
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan painel-dados
          git rm -rq --cached . || true
          mv /tmp/pacote.tgz pacote.tgz
          git add pacote.tgz
          git commit -qm "dados de pesquisa do painel"
          git push -f origin painel-dados
