name: painel-scanner

# Varredura de 15 em 15 min: notas 1-10 dos sinais de day trade e do modelo de fluxo, enviadas ao Google Drive
# (arquivo painel-trade.json), que o painel no Claude le.
# Rodada longa: cada execucao fica ligada ~5h40 varrendo a cada 15 min (o cron curto do GitHub falha muito).
# O cron de hora em hora deixa a proxima rodada na fila; quando uma acaba, a outra comeca.
on:
  schedule:
    - cron: "5 * * * *"   # so garante que sempre ha uma rodada longa ligada ou na fila
  workflow_dispatch:
  push:
    branches: [painel]
    paths: [painel/scanner.py, .github/workflows/painel-scanner.yml]

permissions:
  contents: write
  actions: write          # kronos/acordar.py dispara o kronos de hora em hora

concurrency:
  group: painel-scanner
  cancel-in-progress: false

jobs:
  varrer:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
      TELEGRAM_AVISOS_THREAD_ID: ${{ vars.TELEGRAM_AVISOS_THREAD_ID }}
      DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - run: pip install pandas==3.1.0 numpy==2.5.4 google-auth==2.62.0 requests==2.34.2 scikit-learn==1.9.1
      - name: Trazer o modelo de fluxo
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: painel/modelo.pkl
          key: modelo-atual
          restore-keys: modelo-
      - name: Trazer a coleta
        run: git clone -q --depth 1 -b painel-coleta "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" coleta || mkdir -p coleta
      - name: Varrer de 15 em 15 min (rodada longa)
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}   # acorda o robô privado (robo-bingx); sem ele, não faz nada
          KRONOS_TOKEN: ${{ github.token }}       # dispara o kronos (rodada rápida) de hora em hora
          GDRIVE_FILE_ID: "1ZCiXAx5207lLDqgvIIlMyKEfxydmqiLy"   # painel-trade.json no Drive (nao e segredo)
          RODADA_MIN: ${{ github.event_name == 'push' && '0' || '340' }}   # push (teste): 1 varredura so
        shell: bash
        run: |
          inicio=$(date +%s); falhas=0
          git config --global user.name "github-actions"; git config --global user.email "github-actions@users.noreply.github.com"
          while :; do
            if python painel/scanner.py >> run.log 2>&1; then falhas=0; else falhas=$((falhas+1)); fi
            tail -n 15 run.log
            ( cd coleta && rm -rf .git && git init -q && git checkout -q -b painel-coleta && git add -A \
              && git commit -qm "coleta do painel" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" painel-coleta ) || true
            python3 -c "import central; central.publicar_branch()" && rm -rf central_novo || true
            python3 painel/acordar_robo.py || true
            python3 kronos/acordar.py || true
            [ "$falhas" -ge 3 ] && exit 1
            agora=$(date +%s); [ $(( (agora - inicio) / 60 )) -ge "$RODADA_MIN" ] && break
            prox=$(( (agora / 900 + 1) * 900 + 60 )); sleep $(( prox - agora ))
          done
      - name: Gravar a coleta (book e registro do modelo; 1 commit so)
        if: always()
        run: |
          cd coleta && rm -rf .git && git init -q && git checkout -q -b painel-coleta
          git add -A && git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "coleta do painel" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" painel-coleta
      - name: Guardar resultado (so no teste)
        if: github.ref == 'refs/heads/painel'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp run.log painel/scanner.log
          git add painel/painel.json painel/scanner.log
          git diff --staged --quiet || git commit -m "painel: teste do scanner"
          git pull --rebase --autostash || true
          git push || true
      - name: Avisar falha (topico Avisos)
        if: always()
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
        run: python3 avisos.py "${{ github.workflow }}" "${{ job.status }}"

