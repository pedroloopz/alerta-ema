name: painel-acoes

# Pesquisa: modelo de chance para ações em perp da BingX (preço + volume + QQQ).
# Recalibração automática de seg a sex: relatório relatorio_ml_acoes.txt e histórico
# painel/ml_acoes_historico.csv (uma linha por saída/lado). Ainda não muda o painel nem o robô.
on:
  schedule:
    - cron: "41 1 * * 2-6"   # 22h41 de Brasília, de seg a sex, depois do pós-mercado americano
  workflow_dispatch:
    inputs:
      max:
        description: "Limitar a N ações (0 = todas)"
        default: "0"
  push:
    branches: [main]
    paths: [painel/modelo_acoes.py, .github/workflows/painel-acoes.yml]

permissions:
  contents: write

concurrency:
  group: painel-acoes
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
      TELEGRAM_AVISOS_THREAD_ID: ${{ vars.TELEGRAM_AVISOS_THREAD_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests scikit-learn==1.9.1
      - name: Treinar e medir fora da amostra
        shell: bash
        run: python painel/modelo_acoes.py --max "${{ github.event.inputs.max || '0' }}" 2>&1 | tee run.log; exit ${PIPESTATUS[0]}
      - name: Salvar relatório
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp run.log painel/modelo_acoes.log 2>/dev/null || true
          for f in relatorio_ml_acoes.txt painel/ml_acoes.json painel/ml_acoes_historico.csv painel/modelo_acoes.log; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || git commit -m "painel: teste do modelo de ações"
          git pull --rebase --autostash || true
          git push || true
      - name: Avisar falha (topico Avisos)
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 avisos.py "${{ github.workflow }}" "${{ job.status }}"
