name: maxmin

# Roda so quando voce mandar. Maximas e minimas, so EUA.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-24.04
    env:
      TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
      TELEGRAM_AVISOS_THREAD_ID: ${{ vars.TELEGRAM_AVISOS_THREAD_ID }}
      DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Testar maximas e minimas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
        shell: bash
        run: python backtest_maxmin.py 2>&1 | tee -a run.log

      - name: Salvar relatorio no repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add relatorio_maxmin.txt || true
          git diff --staged --quiet || git commit -m "teste maximas e minimas"
          git pull --rebase --autostash || true
          git push || true

      - name: Avisar falha (topico Avisos)
        if: always()
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
        run: python3 avisos.py "${{ github.workflow }}" "${{ job.status }}"
