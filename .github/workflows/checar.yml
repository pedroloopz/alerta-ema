name: checar-simbolos

# Roda so quando voce mandar, pelo botao "Run workflow".
on:
  workflow_dispatch:

jobs:
  checar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: TEMP bot MODO=teste no fechamento de sexta (rotacao simulada)
        env:
          MODO: teste
          FASE: depois
          AGORA: "2026-10-09T21:15Z"
        run: python bot.py

      - name: TEMP previa sem B3 e sem Telegram
        run: python previa.py

