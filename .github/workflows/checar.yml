name: checar-simbolos

# Roda so quando voce mandar, pelo botao "Run workflow".
on:
  workflow_dispatch:

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Conferir simbolos na Binance
        run: python checar_simbolos.py
