name: checar-simbolos

# Roda so quando voce mandar, pelo botao "Run workflow".
on:
  workflow_dispatch:

jobs:
  checar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Conferir simbolos na corretora
        run: python checar_simbolos.py

      # Confirma que o token e o chat ID guardados nos secrets funcionam.
      - name: Mandar mensagem de teste no Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" ${TELEGRAM_THREAD_ID:+-d message_thread_id="$TELEGRAM_THREAD_ID"} \
            -d text="Teste do robo: token e chat ID funcionando." \
            | head -c 300
