name: painel-central

# Junta as mensagens dos bots (branch `central` de cada repositorio) e manda para o
# Google Drive, de onde a pagina Central no Claude le. Substitui o Telegram.
on:
  schedule:
    - cron: "8,23,38,53 * * * *"   # a cada 15 min, logo depois do scanner (GitHub pode atrasar)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: painel-central
  cancel-in-progress: false

jobs:
  juntar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - run: pip install google-auth==2.62.0 requests==2.34.2 pillow==13.0.0
      - name: Juntar e enviar ao Drive
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        shell: bash
        run: python painel/central_relay.py 2>&1 | tee run.log; exit ${PIPESTATUS[0]}
