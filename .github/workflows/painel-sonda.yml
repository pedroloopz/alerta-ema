name: painel-sonda
on:
  push:
    branches: [painel]
    paths: [painel/sonda.py, .github/workflows/painel-sonda.yml]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python painel/sonda.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add painel/ogai
          git diff --staged --quiet || git commit -m "painel: textos de Ogai (temporario)"
          git pull --rebase --autostash || true
          git push || true
