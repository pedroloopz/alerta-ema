name: painel-calibrar

# Calibracao diaria do painel de day trade (60 dias de candles de 15 min, todo o universo).
# Grava painel/stats.json, que o painel-scanner usa a cada 15 min.
on:
  schedule:
    - cron: "7 3 * * *"     # 0h07 de Brasilia
  workflow_dispatch:
    inputs:
      max:
        description: "Limitar a N ativos (0 = todos)"
        default: "0"
  push:
    branches: [painel, main]
    paths: [painel/calibrar.py, painel/nucleo.py, painel/dados.py, painel/modelo.py, .github/workflows/painel-calibrar.yml]

permissions:
  contents: write

concurrency:
  group: painel-calibrar
  cancel-in-progress: false

jobs:
  calibrar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
      TELEGRAM_AVISOS_THREAD_ID: ${{ vars.TELEGRAM_AVISOS_THREAD_ID }}
      DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - run: pip install pandas==3.1.0 numpy==2.5.4 scikit-learn==1.9.1
      - name: Trazer a coleta (registro dos sinais do modelo)
        run: git clone -q --depth 1 -b painel-coleta "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" coleta || mkdir -p coleta
      - name: Calibrar
        shell: bash
        run: python painel/calibrar.py --max "${{ github.event.inputs.max || '0' }}" 2>&1 | tee painel/calibrar.log; exit ${PIPESTATUS[0]}
      - name: Guardar o modelo (cache, lido pelo scanner)
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: painel/modelo.pkl
          key: modelo-${{ github.run_id }}
      - name: Salvar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add painel/stats.json painel/calibrar.log
          git diff --staged --quiet || git commit -m "painel: calibracao"
          git pull --rebase --autostash || true
          git push || true
      - name: Avisar falha (topico Avisos)
        if: always()
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
        run: python3 avisos.py "${{ github.workflow }}" "${{ job.status }}"
