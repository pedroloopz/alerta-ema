name: alerta-ema

on:
  schedule:
    # A cada 30 min, todos os dias: perp de acao negocia fora do pregao.
    # Candle de 4h nao exige checagem mais frequente que isso.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Rodar verificacao
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alerta_ema.py

      - name: Salvar estado
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add estado.json || true
          git diff --staged --quiet || git commit -m "atualiza estado"
          git push || true
